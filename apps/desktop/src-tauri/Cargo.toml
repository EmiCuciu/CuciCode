[package]
name = "cucicode"
version = "0.1.0"
description = "Desktop UI for Claude Code"
edition = "2021"
publish = false

[lib]
name = "cucicode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.54.1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
thiserror = "=2.0.21"
dirs = "=7.0.0"
whisper-rs = "=0.16.0"
cpal = "=0.18.2"
ureq = "=3.5.2"
yaml-rust2 = "=0.13.0"
walkdir = "=2.5.0"
keyring = "=4.2.0"
notify = "=8.2.2"

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"

[profile.release]
strip = true
lto = "thin"
